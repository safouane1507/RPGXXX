<section class="faq-page">
  <div class="faq-hero">
    <div class="container">
      <h1>{{ 'FAQ.TITLE' | translate }}</h1>
      <p class="subtitle">{{ 'FAQ.SUBTITLE' | translate }}</p>
    </div>
  </div>

  <div class="container section-spacing">
    <div class="faq-list">
      @for (item of ('FAQ.ITEMS' | translate); track item.q; let i = $index) {
        <div class="faq-item" [class.open]="openIndex() === i">
          <button class="faq-q" (click)="toggle(i)">
            {{ item.q }}
            <svg viewBox="0 0 24 24" fill="none" width="16" height="16" [style.transform]="openIndex() === i ? 'rotate(180deg)' : ''">
              <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
          @if (openIndex() === i) {
            <div class="faq-a">{{ item.a }}</div>
          }
        </div>
      }
    </div>
  </div>
</section>
