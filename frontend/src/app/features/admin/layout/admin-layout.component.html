<div class="admin-shell" [class.sidebar-collapsed]="!isSidebarOpen()">

  <!-- ── Sidebar ─────────────────────────────────────────── -->
  <app-admin-sidebar />

  <!-- ── Main Area ──────────────────────────────────────── -->
  <div class="admin-main">

    <!-- Top Bar -->
    <header class="admin-topbar">
      <div class="topbar-left">
        <button class="sidebar-toggle" (click)="toggleSidebar()" aria-label="Toggle sidebar">
          <svg viewBox="0 0 24 24" fill="none" width="20" height="20">
            <line x1="3" y1="6"  x2="21" y2="6"  stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="3" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="3" y1="18" x2="21" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <h1 class="page-title">{{ pageTitle() }}</h1>
      </div>

      <div class="topbar-right">
        <!-- Breadcrumb hint -->
        <span class="brand-pill">
          <img src="assets/logo.png" alt="" class="pill-logo" />
          KENZ BLADI
        </span>

        <!-- Theme toggle -->
        <button class="icon-btn" (click)="toggleTheme()" aria-label="Toggle theme">
          @if (isDarkMode()) {
            <svg viewBox="0 0 24 24" fill="none" width="18" height="18">
              <circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="2"/>
              <path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"
                stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" fill="none" width="18" height="18">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          }
        </button>

        <!-- Admin avatar placeholder -->
        <div class="admin-avatar" title="Administrateur">A</div>
      </div>
    </header>

    <!-- Page Content -->
    <main class="admin-content">
      <router-outlet />
    </main>

  </div>
</div>
